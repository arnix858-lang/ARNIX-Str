name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing GitHub Actions secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing GitHub Actions secret: ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arnix-release.jks"
      - name: Build signed release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/arnix-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ARNIX-Cinema-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Prepare update APK filename
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ARNIX-Cinema.apk
      - name: Generate Russian release notes
        run: |
          cat > CURRENT_RELEASE_NOTES.md <<'NOTES'
          Исправления и улучшения текущей версии ARNIX Cinema.
          NOTES
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ARNIX Cinema 1.0.${{ github.run_number }}
          body_path: CURRENT_RELEASE_NOTES.md
          files: app/build/outputs/apk/release/ARNIX-Cinema.apk
          fail_on_unmatched_files: true
